<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>电力系统储能技术 Agent</title>
  <style>
    :root { color-scheme: light; --ink: #20303a; --muted: #63727b; --line: #d7e0e3; --paper: #ffffff; --wash: #f3f7f6; --accent: #176b67; --accent-strong: #0e4e4b; --warm: #a65d2c; }
    * { box-sizing: border-box; }
    body { margin: 0; background: var(--wash); color: var(--ink); font: 16px/1.6 system-ui, -apple-system, "Segoe UI", sans-serif; }
    main { max-width: 980px; margin: 0 auto; padding: 24px 18px 42px; }
    header { display: flex; justify-content: space-between; gap: 16px; align-items: end; margin-bottom: 18px; }
    h1 { margin: 0; font-size: clamp(1.35rem, 4vw, 2rem); letter-spacing: 0; }
    .ai-badge { color: var(--warm); font-size: .82rem; white-space: normal; }
    .toolbar, .answer, .sources { background: var(--paper); border: 1px solid var(--line); border-radius: 6px; }
    .toolbar { padding: 16px; display: grid; gap: 12px; }
    label { font-weight: 650; }
    select, textarea, button { font: inherit; }
    select, textarea { width: 100%; border: 1px solid #b8c8cb; border-radius: 4px; padding: 10px 12px; background: #fff; color: var(--ink); }
    textarea { min-height: 116px; resize: vertical; }
    .actions { display: flex; gap: 10px; flex-wrap: wrap; }
    button { border: 1px solid var(--accent); border-radius: 4px; padding: 9px 15px; cursor: pointer; background: var(--accent); color: #fff; font-weight: 650; }
    button.secondary { background: #fff; color: var(--accent-strong); }
    button:disabled { cursor: wait; opacity: .6; }
    .status { min-height: 1.6em; color: var(--muted); }
    .answer, .sources { margin-top: 16px; padding: 18px; }
    .dashboard { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px; margin-top: 16px; }
    .panel { background: var(--paper); border: 1px solid var(--line); border-radius: 6px; padding: 14px; min-width: 0; }
    .panel h2 { margin: 0 0 8px; font-size: 1rem; }
    .panel button { padding: 6px 10px; font-size: .9rem; margin: 3px 0; }
    .panel-list { max-height: 230px; overflow: auto; }
    .panel-list button { display: block; width: 100%; text-align: left; background: #fff; color: var(--accent-strong); }
    .graph-node { border-left: 4px solid #aeb9bd; }
    .graph-node.status-learning { border-left-color: #2f7f95; }
    .graph-node.status-mastered { border-left-color: #2f8a57; }
    .graph-node.status-weak { border-left-color: #b74a3c; }
    .panel-list p { margin: 6px 0; color: var(--muted); font-size: .9rem; }
    .scenario-actions { display: flex; gap: 6px; flex-wrap: wrap; }
    .teacher-tools, .assignments { margin-top: 16px; }
    .teacher-grid { display: grid; grid-template-columns: 1fr 180px 100px; gap: 8px; align-items: end; }
    .teacher-grid input, .teacher-grid select { min-width: 0; }
    .kb-grid { display: grid; grid-template-columns: 1fr 1fr auto; gap: 8px; align-items: end; margin-bottom: 10px; }
    .assignment-item { border-top: 1px solid var(--line); padding: 9px 0; }
    .assignment-item:first-child { border-top: 0; }
    .assignment-question { margin: 8px 0; padding: 8px; background: var(--wash); border-radius: 4px; }
    .status-good { color: #176b67; }
    .status-warn { color: var(--warm); }
    @media (max-width: 820px) { .dashboard { grid-template-columns: 1fr; } }
    @media (max-width: 620px) {
      .kb-grid, .teacher-grid { grid-template-columns: 1fr; }
      /* Stack teacher controls so fixed desktop columns cannot overflow a
         narrow phone viewport or make the primary action unreachable. */
      .teacher-grid button { width: 100%; }
    }
    .answer h2, .sources h2 { margin: 0 0 8px; font-size: 1rem; }
    #answerText { white-space: pre-wrap; overflow-wrap: anywhere; }
    .source { border-top: 1px solid var(--line); padding: 9px 0; }
    .source:first-child { border-top: 0; }
    .source-title { font-weight: 650; }
    .source-meta { color: var(--muted); font-size: .9rem; }
    @media (max-width: 620px) { main { padding: 16px 12px 30px; } header { display: block; } .ai-badge { display: block; margin-top: 4px; } }
  </style>
</head>
<body>
  <main>
    <header>
      <h1>电力系统储能技术 Agent</h1>
      <span class="ai-badge">AI 生成内容，请核验课程来源</span>
    </header>
    <form class="toolbar" id="agentForm">
      <div>
        <label for="mode">工作场景</label>
        <select id="mode">
          <option value="qa">课程知识问答</option>
          <option value="learning_diagnosis">学习诊断与路径</option>
          <option value="scenario">情景演绎</option>
          <option value="teacher_assistant">教师备课</option>
          <option value="question_draft">出题草稿</option>
          <option value="grading">批改辅助</option>
        </select>
      </div>
      <div>
        <label for="question">问题</label>
        <textarea id="question" required placeholder="请输入课程问题、薄弱知识点或备课要求"></textarea>
      </div>
      <div class="actions">
        <button id="submit" type="submit">发送问题</button>
        <button id="clear" class="secondary" type="button">清空结果</button>
      </div>
      <div class="status" id="status" role="status" aria-live="polite"></div>
    </form>
    <section class="dashboard" aria-label="课程功能">
      <article class="panel">
        <h2>知识图谱</h2>
        <div class="panel-list" id="graphList">登录后加载章节。</div>
      </article>
      <article class="panel">
        <h2>教材查阅</h2>
        <div class="panel-list" id="resourceList">选择章节后显示课件。</div>
      </article>
      <article class="panel">
        <h2>我的学情</h2>
        <div class="panel-list" id="profileList">完成题目后显示确定性学习状态。</div>
        <button id="loadProfile" type="button" class="secondary">刷新学情</button>
        <button id="loadDiagnosis" type="button" class="secondary">生成诊断解释</button>
      </article>
    </section>
    <section class="panel" style="margin-top:16px">
      <h2>情景演绎</h2>
      <div class="scenario-actions">
        <button id="startScenario" type="button">开始并网调度场景</button>
        <button id="startFaultScenario" type="button" class="secondary">开始故障分析场景</button>
        <button id="endScenario" type="button" class="secondary" disabled>结束当前场景</button>
      </div>
      <div class="status" id="scenarioStatus">场景中的数值均明确标记为模拟数据。</div>
    </section>
    <section class="panel teacher-tools" id="teacherTools" hidden>
      <h2>教师题目与作业</h2>
      <div class="teacher-grid">
        <div><label for="draftPrompt">题目草稿</label><input id="draftPrompt" type="text" placeholder="输入题干" /></div>
        <div><label for="draftType">题型</label><select id="draftType"><option value="single_choice">选择题</option><option value="true_false">判断题</option><option value="short_answer">简答题</option></select></div>
        <button id="createDraft" type="button">保存草稿</button>
      </div>
      <div class="panel-list" id="teacherQuestionList">暂无题目。</div>
      <div class="actions">
        <input id="assignmentTitle" type="text" placeholder="作业名称" />
        <button id="createAssignment" type="button">发布作业</button>
      </div>
    </section>
    <section class="panel teacher-tools" id="knowledgeBasePanel" hidden>
      <h2>知识库版本与服务状态</h2>
      <div class="status" id="serviceStatus">仅教师和管理员可查看授权课程的版本状态。</div>
      <div class="kb-grid">
        <div><label for="kbVersionName">版本名称</label><input id="kbVersionName" type="text" placeholder="例如 xingchen-v2" /></div>
        <div><label for="kbWorkflowId">已发布 Workflow ID</label><input id="kbWorkflowId" type="text" placeholder="填写平台发布后的 ID" /></div>
        <button id="createKbVersion" type="button">创建版本</button>
      </div>
      <div class="actions">
        <input id="kbFiles" type="file" multiple accept=".pdf,.md" />
        <button id="uploadKbFiles" type="button" class="secondary">上传到选中版本</button>
      </div>
      <div class="panel-list" id="knowledgeBaseList">尚未加载知识库版本。</div>
      <button id="loadKnowledgeBase" type="button" class="secondary">刷新知识库状态</button>
    </section>
    <section class="panel teacher-tools" id="adminPanel" hidden>
      <h2>管理员服务状态</h2>
      <div class="panel-list" id="adminStatus">仅管理员可查看脱敏运维状态。</div>
      <button id="loadAdminStatus" type="button" class="secondary">刷新服务状态</button>
    </section>
    <section class="panel assignments" id="assignmentsPanel">
      <h2>章节作业</h2>
      <div class="panel-list" id="assignmentList">登录后加载作业。</div>
    </section>
    <section class="answer" aria-live="polite">
      <h2>回答</h2>
      <div id="answerText">尚未提交问题。</div>
    </section>
    <section class="sources">
      <h2>课程来源</h2>
      <div id="sourcesList">回答后显示可核验的课件来源。</div>
    </section>
  </main>
  <script>
    const form = document.querySelector('#agentForm');
    const mode = document.querySelector('#mode');
    const question = document.querySelector('#question');
    const submit = document.querySelector('#submit');
    const status = document.querySelector('#status');
    const answerText = document.querySelector('#answerText');
    const sourcesList = document.querySelector('#sourcesList');
    const featureByMode = new Map();
    let sessionReady = false;
    let currentScenario = null;
    let scenarioTurn = 0;
    let profileStatusByNode = new Map();
    let currentRole = 'student';
    let publishedQuestionIds = [];
    let moodleSesskey = '';
    let selectedKbVersionId = '';
    const operationKeys = new Map();
    let scenarioStartGeneration = 0;

    function randomOperationToken() {
      // randomUUID is restricted to secure contexts in some browsers. Keep
      // HTTP-by-IP development usable while preferring browser CSPRNG APIs.
      if (globalThis.crypto?.randomUUID) return globalThis.crypto.randomUUID();
      if (globalThis.crypto?.getRandomValues) {
        const bytes = new Uint8Array(16);
        globalThis.crypto.getRandomValues(bytes);
        return Array.from(bytes, (value) => value.toString(16).padStart(2, '0')).join('');
      }
      return `${Date.now()}-${Math.random().toString(36).slice(2)}`;
    }

    function operationKey(scope, signature) {
      // Retries reuse one key for one logical operation; changed business
      // input gets a different key and remains independently idempotent.
      const mapKey = `${scope}|${signature}`;
      if (!operationKeys.has(mapKey)) operationKeys.set(mapKey, `${scope}-${randomOperationToken()}`);
      return operationKeys.get(mapKey);
    }

    function clearResults() {
      answerText.textContent = '尚未提交问题。';
      sourcesList.textContent = '回答后显示可核验的课件来源。';
      status.textContent = '';
    }

    function sourceValue(metadata, key, fallback) {
      const value = metadata && metadata[key];
      return value === undefined || value === null || value === '' ? fallback : String(value);
    }

    function setAvailableModes(features) {
      for (const option of mode.options) {
        const enabled = Boolean(features[option.value]);
        featureByMode.set(option.value, enabled);
        option.hidden = !enabled;
      }
      const first = Array.from(mode.options).find((option) => !option.hidden);
      if (first) mode.value = first.value;
    }

    async function openSession() {
      try {
        const response = await fetch('/api/course/session/open', { method: 'POST', credentials: 'same-origin' });
        const payload = await response.json();
        if (!response.ok || payload.status !== 'ok') throw new Error(payload.error?.message || '课程会话未建立');
        setAvailableModes(payload.data.features || {});
        sessionReady = true;
        currentRole = payload.data.role;
        moodleSesskey = payload.data.csrf_token || '';
        document.querySelector('#teacherTools').hidden = !['teacher', 'admin'].includes(currentRole);
        document.querySelector('#knowledgeBasePanel').hidden = !['teacher', 'admin'].includes(currentRole);
        document.querySelector('#adminPanel').hidden = currentRole !== 'admin';
        status.textContent = `当前角色：${payload.data.role}`;
        try {
          const profile = await apiJson('/api/learning/profile');
          profileStatusByNode = new Map((profile.nodes || []).map((node) => [node.id, node.status]));
        } catch (_) {
          // A missing profile is not permission to guess a mastery state.
          profileStatusByNode = new Map();
        }
        await loadGraph(payload.data.chapters || []);
        await loadAssignments();
        if (['teacher', 'admin'].includes(currentRole)) {
          await loadTeacherQuestions();
          await loadKnowledgeBase();
        }
        if (currentRole === 'admin') await loadAdminStatus();
      } catch (error) {
        status.textContent = error instanceof Error ? error.message : '课程会话未建立。';
      }
    }

    async function apiJson(url, options = {}) {
      const response = await fetch(url, { credentials: 'same-origin', ...options });
      const payload = await response.json().catch(() => ({}));
      if (!response.ok || payload.status === 'error') throw new Error(payload.error?.message || `服务返回 HTTP ${response.status}`);
      return payload.data;
    }

    async function loadGraph(chapters) {
      const list = document.querySelector('#graphList');
      list.replaceChildren();
      chapters.forEach((chapter) => {
        const button = document.createElement('button');
        button.type = 'button';
        button.textContent = chapter.name;
        button.addEventListener('click', async () => {
          try {
            const data = await apiJson(`/api/textbook/resources?chapter_id=${encodeURIComponent(chapter.id)}`);
            renderResources(data.items || []);
            const nodes = await apiJson(`/api/knowledge-graph/search?q=${encodeURIComponent(chapter.name.split(' ').pop() || chapter.name)}`);
            button.title = `${nodes.total || 0} 个相关知识点`;
          } catch (error) { status.textContent = error.message || '图谱暂不可用。'; }
        });
        list.append(button);
      });
      try {
        const points = await apiJson('/api/knowledge-graph/search?limit=100&page_size=100');
        (points.items || []).forEach((point) => {
          const button = document.createElement('button');
          button.type = 'button';
          button.className = `graph-node status-${profileStatusByNode.get(point.id) || 'unassessed'}`;
          button.textContent = `  ${point.name}`;
          button.setAttribute('aria-label', `${point.name}：${profileStatusByNode.get(point.id) || '未评估'}`);
          button.addEventListener('click', async () => {
            try {
              const node = await apiJson(`/api/knowledge-graph/nodes/${encodeURIComponent(point.id)}`);
              renderResources(node.resources || []);
              question.value = `请解释知识点“${node.name}”，并说明它的先修知识。`;
              mode.value = 'qa';
            } catch (error) { status.textContent = error.message || '知识点加载失败。'; }
          });
          list.append(button);
        });
      } catch (error) { status.textContent = error.message || '知识点加载失败。'; }
      if (!chapters.length) list.textContent = '暂无章节数据。';
    }

    function renderResources(resources) {
      const list = document.querySelector('#resourceList');
      list.replaceChildren();
      if (!resources.length) { list.textContent = '该章节暂未挂载课件。'; return; }
      resources.forEach((resource) => {
        const item = document.createElement('p');
        const link = document.createElement('a');
        link.href = `/local/course_agent/resource.php?source=${encodeURIComponent(resource.normalized_file)}&page=1`;
        link.target = '_blank';
        link.rel = 'noopener';
        link.textContent = `${resource.source_file} · ${resource.version}`;
        item.append(link);
        list.append(item);
      });
    }

    async function loadProfile() {
      try {
        const data = await apiJson('/api/learning/profile');
        const list = document.querySelector('#profileList');
        list.replaceChildren();
        data.nodes.forEach((node) => {
          const item = document.createElement('p');
          const ratio = node.ratio === null ? '未评估' : `${Math.round(node.ratio * 100)}%`;
          item.textContent = `${node.name}：${node.status}（${ratio}）`;
          list.append(item);
        });
      } catch (error) { status.textContent = error.message || '学情暂不可用。'; }
    }

    async function loadDiagnosis() {
      try {
        const data = await apiJson('/api/student/learning-diagnosis', {
          method: 'POST', headers: { 'Content-Type': 'application/json', 'X-Moodle-Sesskey': moodleSesskey, 'Idempotency-Key': operationKey('learning-diagnosis', 'current') },
          body: JSON.stringify({ question: '请解释我的学习状态，并给出下一步复习建议。' })
        });
        answerText.textContent = `${data.ai_generated ? 'AI 生成内容，请核验课程来源。\n\n' : ''}${data.ai_explanation || '暂无足够数据生成解释。'}`;
        renderSources(data.sources || []);
        status.textContent = '学习诊断已生成，确定性指标仍以页面学情为准。';
      } catch (error) { status.textContent = error.message || '学习诊断暂不可用。'; }
    }

    async function loadAdminStatus() {
      try {
        const data = await apiJson('/api/admin/status');
        const list = document.querySelector('#adminStatus');
        list.replaceChildren();
        const workflow = document.createElement('p');
        workflow.className = data.workflow_configured ? 'status-good' : 'status-warn';
        workflow.textContent = `讯飞 Workflow：${data.workflow_configured ? '已配置' : '待配置'}${data.mock_workflow ? '（Mock 模式）' : ''}`;
        const kb = document.createElement('p');
        kb.textContent = `当前知识库：${data.published_kb ? `${data.published_kb.version_name} · ${data.published_kb.hit_status || '未测试'}` : '尚无已发布版本'}`;
        const backup = document.createElement('p');
        backup.textContent = `备份：${data.backup?.status === 'verify_on_server' ? '请在服务器验收脚本中核验' : '状态未知'}`;
        list.append(workflow, kb, backup);
      } catch (error) { document.querySelector('#adminStatus').textContent = error.message || '服务状态暂不可用。'; }
    }

    async function loadTeacherQuestions() {
      try {
        const data = await apiJson('/api/questions');
        const list = document.querySelector('#teacherQuestionList');
        list.replaceChildren();
        publishedQuestionIds = [];
        (data.items || []).forEach((item) => {
          const row = document.createElement('div');
          row.className = 'assignment-item';
          row.textContent = `${item.prompt} · ${item.status}`;
          if (item.status === 'published') publishedQuestionIds.push(item.id);
          if (item.status === 'draft') {
            const button = document.createElement('button');
            button.type = 'button'; button.textContent = '审核发布';
            button.addEventListener('click', async () => {
              await apiJson(`/api/teacher/questions/${encodeURIComponent(item.id)}/publish`, { method: 'POST', headers: { 'X-Moodle-Sesskey': moodleSesskey, 'Idempotency-Key': `publish-${item.id}` } });
              await loadTeacherQuestions();
            });
            row.append(' ', button);
          }
          list.append(row);
        });
        if (!data.items?.length) list.textContent = '暂无题目。';
      } catch (error) { status.textContent = error.message || '题目列表加载失败。'; }
    }

    async function loadKnowledgeBase() {
      try {
        // The API filters by Moodle role and course; the browser never gets
        // credentials or an unscoped platform management object.
        const data = await apiJson('/api/knowledge-base/versions?page=1&page_size=20');
        const list = document.querySelector('#knowledgeBaseList');
        const service = document.querySelector('#serviceStatus');
        list.replaceChildren();
        service.textContent = `当前角色：${currentRole}；课程 Agent Adapter 会话已建立。`;
        (data.items || []).forEach((version) => {
          const item = document.createElement('div');
          item.className = 'assignment-item';
          const text = document.createElement('p');
          text.textContent = `${version.version_name} · ${version.status} · 文件 ${version.source_count} · 命中 ${version.hit_status || '未测试'}`;
          item.append(text);
          const actions = document.createElement('div');
          actions.className = 'actions';
          const test = document.createElement('button');
          test.type = 'button'; test.className = 'secondary'; test.textContent = '运行三题命中测试';
          test.addEventListener('click', () => runKbHitTests(version.id));
          if (['processing', 'tested', 'failed'].includes(version.status)) actions.append(test);
          if (version.status === 'tested') {
            const publish = document.createElement('button');
            publish.type = 'button'; publish.textContent = '发布版本';
            publish.addEventListener('click', () => changeKbStatus(version.id, 'published'));
            actions.append(publish);
          } else if (version.status === 'archived') {
            const rollback = document.createElement('button');
            rollback.type = 'button'; rollback.className = 'secondary'; rollback.textContent = '回滚到此版本';
            rollback.addEventListener('click', () => rollbackKb(version.id));
            actions.append(rollback);
          }
          if (version.status === 'processing') {
            const tested = document.createElement('button');
            tested.type = 'button'; tested.textContent = '测试完成';
            tested.addEventListener('click', () => changeKbStatus(version.id, 'tested'));
            actions.append(tested);
          }
          item.append(actions);
          list.append(item);
        });
        if (!data.items?.length) list.textContent = '尚未登记讯飞知识库版本。';
      } catch (error) {
        document.querySelector('#serviceStatus').textContent = error.message || '知识库状态暂不可用。';
      }
    }

    async function runKbHitTests(versionId) {
      try {
        for (const caseId of ['qa-001', 'qa-002', 'qa-003']) {
          await apiJson(`/api/knowledge-base/versions/${encodeURIComponent(versionId)}/hit-tests`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json', 'X-Moodle-Sesskey': moodleSesskey, 'Idempotency-Key': `kb-hit-${versionId}-${caseId}` },
            body: JSON.stringify({ case_id: caseId })
          });
        }
        status.textContent = '三道黄金问题均已执行，请继续点击“测试完成”。';
        await loadKnowledgeBase();
      } catch (error) { status.textContent = error.message || '知识库命中测试失败。'; }
    }

    async function changeKbStatus(versionId, nextStatus) {
      try {
        await apiJson(`/api/knowledge-base/versions/${encodeURIComponent(versionId)}/status`, {
          method: 'POST', headers: { 'Content-Type': 'application/json', 'X-Moodle-Sesskey': moodleSesskey, 'Idempotency-Key': `kb-status-${versionId}-${nextStatus}` },
          body: JSON.stringify({ status: nextStatus })
        });
        status.textContent = nextStatus === 'published' ? '知识库版本已发布。' : '知识库版本已标记为测试完成。';
        await loadKnowledgeBase();
      } catch (error) { status.textContent = error.message || '知识库状态变更失败。'; }
    }

    async function rollbackKb(versionId) {
      try {
        await apiJson(`/api/knowledge-base/versions/${encodeURIComponent(versionId)}/rollback`, {
          method: 'POST', headers: { 'Content-Type': 'application/json', 'X-Moodle-Sesskey': moodleSesskey, 'Idempotency-Key': `kb-rollback-${versionId}` },
          body: JSON.stringify({ reason: '教师在课程页面发起回滚' })
        });
        status.textContent = '知识库已回滚，旧版本重新成为当前发布版本。';
        await loadKnowledgeBase();
      } catch (error) { status.textContent = error.message || '知识库回滚失败。'; }
    }

    document.querySelector('#createKbVersion').addEventListener('click', async () => {
      const name = document.querySelector('#kbVersionName').value.trim();
      const workflowId = document.querySelector('#kbWorkflowId').value.trim();
      if (!name || !workflowId) { status.textContent = '版本名称和已发布 Workflow ID 不能为空。'; return; }
      try {
        const version = await apiJson('/api/knowledge-base/versions', {
          method: 'POST', headers: { 'Content-Type': 'application/json', 'X-Moodle-Sesskey': moodleSesskey, 'Idempotency-Key': operationKey('kb-create', `${name}|${workflowId}`) },
          body: JSON.stringify({ version_name: name, workflow_id: workflowId, manifest_sha256: 'local-manifest' })
        });
        selectedKbVersionId = version.id;
        status.textContent = `版本 ${version.version_name} 已创建，请选择文件上传。`;
        await loadKnowledgeBase();
      } catch (error) { status.textContent = error.message || '知识库版本创建失败。'; }
    });

    document.querySelector('#uploadKbFiles').addEventListener('click', async () => {
      const files = Array.from(document.querySelector('#kbFiles').files || []);
      if (!files.length) { status.textContent = '请先选择 PDF 或 Markdown 文件。'; return; }
      const versions = await apiJson('/api/knowledge-base/versions?page=1&page_size=20');
      const versionName = document.querySelector('#kbVersionName').value.trim();
      const target = versions.items.find((item) => item.id === selectedKbVersionId && ['draft', 'processing'].includes(item.status))
        || versions.items.find((item) => item.version_name === versionName && ['draft', 'processing'].includes(item.status));
      if (!target) { status.textContent = '请在版本名称框填写当前 draft/processing 版本名称。'; return; }
      try {
        for (const file of files) {
          await apiJson(`/api/knowledge-base/versions/${encodeURIComponent(target.id)}/files?filename=${encodeURIComponent(file.name)}`, {
            method: 'PUT', headers: { 'X-Moodle-Sesskey': moodleSesskey, 'Idempotency-Key': `kb-upload-${target.id}-${file.name}-${file.size}-${file.lastModified}` }, body: file
          });
        }
        status.textContent = `已上传 ${files.length} 个文件，等待执行三题命中测试。`;
        await loadKnowledgeBase();
      } catch (error) { status.textContent = error.message || '知识库文件上传失败。'; }
    });

    async function loadAssignments() {
      try {
        const data = await apiJson(currentRole === 'student' ? '/api/student/assignments' : '/api/assignments');
        const list = document.querySelector('#assignmentList');
        list.replaceChildren();
        (data.items || []).forEach((assignment) => {
          const row = document.createElement('div'); row.className = 'assignment-item';
          const button = document.createElement('button'); button.type = 'button'; button.textContent = `${assignment.title} · ${assignment.status}`;
          button.addEventListener('click', () => openAssignment(assignment.id));
          row.append(button); list.append(row);
        });
        if (!data.items?.length) list.textContent = '暂无已发布作业。';
      } catch (error) { status.textContent = error.message || '作业列表加载失败。'; }
    }

    async function openAssignment(assignmentId) {
      try {
        const data = await apiJson(`/api/student/assignments/${encodeURIComponent(assignmentId)}`);
        if (currentRole !== 'student') {
          await renderTeacherAssignment(assignmentId, data);
          return;
        }
        const list = document.querySelector('#assignmentList'); list.replaceChildren();
        const answers = {};
        (data.questions || []).forEach((item) => {
          const block = document.createElement('div'); block.className = 'assignment-question';
          const title = document.createElement('div'); title.textContent = item.prompt;
          const input = document.createElement(item.question_type === 'short_answer' || item.question_type === 'essay' ? 'textarea' : 'select');
          if (input.tagName === 'SELECT') {
            const choices = item.question_type === 'true_false' ? [{ value: 'true', text: '正确' }, { value: 'false', text: '错误' }] : (item.options || []).map((value) => ({ value: String(value), text: String(value) }));
            choices.forEach((choice) => { const option = document.createElement('option'); option.value = choice.value; option.textContent = choice.text; input.append(option); });
          } else { input.rows = 2; input.placeholder = '填写答案'; }
          input.addEventListener('input', () => { answers[item.id] = item.question_type === 'true_false' ? input.value === 'true' : input.value; });
          input.dispatchEvent(new Event('input'));
          block.append(title, input); list.append(block);
        });
        // The Adapter has already removed answer keys and rubrics from this
        // student response. Render only the returned score and feedback so a
        // browser-side field cannot accidentally expose teacher-only data.
        (data.my_submissions || []).forEach((submission) => {
          const result = document.createElement('div');
          result.className = 'assignment-question';
          const score = submission.score === null ? '待批改' : `${submission.score}/${submission.max_score}`;
          result.textContent = `第${submission.attempt}次提交：${score}${submission.needs_review ? ' · 待教师复核' : ''}`;
          (submission.grades || []).forEach((grade) => {
            const feedback = document.createElement('p');
            feedback.textContent = `题目 ${grade.question_id}：${grade.feedback || '暂无反馈'}`;
            result.append(feedback);
          });
          list.append(result);
        });
        const submitButton = document.createElement('button'); submitButton.type = 'button'; submitButton.textContent = '提交作业';
        submitButton.addEventListener('click', async () => {
          submitButton.disabled = true;
          try {
            await apiJson(`/api/student/assignments/${encodeURIComponent(assignmentId)}/submit`, { method: 'POST', headers: { 'Content-Type': 'application/json', 'X-Moodle-Sesskey': moodleSesskey, 'Idempotency-Key': operationKey('submission', `${assignmentId}|1`) }, body: JSON.stringify({ answers, attempt: 1 }) });
            status.textContent = '作业已提交，等待批改。';
          } catch (error) { status.textContent = error.message || '提交失败。'; }
          finally { submitButton.disabled = false; }
        });
        list.append(submitButton);
      } catch (error) { status.textContent = error.message || '作业加载失败。'; }
    }

    async function renderTeacherAssignment(assignmentId, assignment) {
      const list = document.querySelector('#assignmentList');
      list.replaceChildren();
      const heading = document.createElement('p');
      heading.textContent = `${assignment.title}：教师批改视图`;
      list.append(heading);
      const batch = document.createElement('button');
      batch.type = 'button'; batch.textContent = '批量批改客观题';
      batch.addEventListener('click', async () => {
        batch.disabled = true;
        try {
          const task = await apiJson(`/api/teacher/assignments/${encodeURIComponent(assignmentId)}/grade`, {
            method: 'POST', headers: { 'X-Moodle-Sesskey': moodleSesskey, 'Idempotency-Key': operationKey('grade', assignmentId) }, body: '{}'
          });
          status.textContent = `批改完成：${task.completed || 0}/${task.total || 0}，${task.status === 'needs_review' ? '存在待教师复核的主观题。' : '无需额外复核。'}`;
          await renderTeacherAssignment(assignmentId, assignment);
        } catch (error) { status.textContent = error.message || '批量批改失败。'; }
        finally { batch.disabled = false; }
      });
      list.append(batch);
      try {
        const data = await apiJson(`/api/teacher/assignments/${encodeURIComponent(assignmentId)}/submissions?page=1&page_size=100`);
        (data.items || []).forEach((submission) => {
          const block = document.createElement('div'); block.className = 'assignment-question';
          const score = submission.score === null ? '待批改' : String(submission.score);
          block.append(Object.assign(document.createElement('p'), { textContent: `${submission.user_uid} · 第${submission.attempt}次 · 得分 ${score}` }));
          (submission.grades || []).forEach((grade) => {
            const row = document.createElement('p');
            row.textContent = `题目 ${grade.question_id}：${grade.score}/${grade.max_score} · ${grade.source}`;
            if (grade.source === 'agent_initial') {
              const confirm = document.createElement('button');
              confirm.type = 'button'; confirm.className = 'secondary'; confirm.textContent = '教师确认初评';
              confirm.addEventListener('click', async () => {
                const reason = window.prompt('请输入教师确认理由', '已核对课程 rubric') || '';
                if (!reason) return;
                try {
                  await apiJson(`/api/teacher/grade-items/${encodeURIComponent(grade.id)}`, {
                    method: 'PATCH', headers: { 'Content-Type': 'application/json', 'X-Moodle-Sesskey': moodleSesskey, 'Idempotency-Key': operationKey('review', grade.id) },
                    body: JSON.stringify({ score: grade.score, reason })
                  });
                  await renderTeacherAssignment(assignmentId, assignment);
                } catch (error) { status.textContent = error.message || '教师复核失败。'; }
              });
              row.append(' ', confirm);
            }
            block.append(row);
          });
          const subjective = (assignment.questions || []).filter((questionItem) => ['short_answer', 'essay'].includes(questionItem.question_type));
          subjective.forEach((questionItem) => {
            const alreadyReviewed = (submission.grades || []).some((grade) => grade.question_id === questionItem.id);
            if (alreadyReviewed) return;
            const review = document.createElement('button');
            review.type = 'button'; review.className = 'secondary'; review.textContent = `请求 Agent 初评：${questionItem.id}`;
            review.addEventListener('click', async () => {
              try {
                await apiJson(`/api/teacher/submissions/${encodeURIComponent(submission.id)}/subjective/${encodeURIComponent(questionItem.id)}/agent-review`, {
                  method: 'POST', headers: { 'X-Moodle-Sesskey': moodleSesskey, 'Idempotency-Key': `agent-review-${submission.id}-${questionItem.id}` }, body: '{}'
                });
                await renderTeacherAssignment(assignmentId, assignment);
              } catch (error) { status.textContent = error.message || 'Agent 初评失败，请人工处理。'; }
            });
            block.append(review);
          });
          list.append(block);
        });
        if (!data.items?.length) list.append(Object.assign(document.createElement('p'), { textContent: '暂无学生提交。' }));
      } catch (error) { status.textContent = error.message || '学生提交加载失败。'; }
    }

    function consumeEvent(block, state) {
      const lines = block.split('\n');
      const eventName = (lines.find((line) => line.startsWith('event:')) || 'event: error').slice(6).trim();
      const dataLine = lines.find((line) => line.startsWith('data:'));
      if (!dataLine) return;
      const data = JSON.parse(dataLine.slice(5).trim());
      if (eventName === 'token') {
        answerText.textContent += String(data.text || '');
      } else if (eventName === 'source') {
        state.sources.push(data);
        renderSources(state.sources.map((source) => ({ metadata: source })));
      } else if (eventName === 'done') {
        state.done = true;
        if (mode.value === 'scenario' && currentScenario) scenarioTurn += 1;
        status.textContent = '回答完成。';
      } else if (eventName === 'error') {
        throw new Error(data.message || 'Agent 请求失败。');
      }
    }

    function renderSources(documents) {
      sourcesList.replaceChildren();
      if (!Array.isArray(documents) || documents.length === 0) {
        sourcesList.textContent = '本次回答没有返回课程来源，请将结果视为不可核验。';
        return;
      }
      documents.forEach((sourceDocument) => {
        const metadata = sourceDocument && (sourceDocument.metadata || sourceDocument.meta || {});
        const item = document.createElement('div');
        item.className = 'source';
        const verified = metadata.status !== 'unverified' && sourceValue(metadata, 'file', '') && Number(sourceValue(metadata, 'page', 0)) > 0;
        const title = document.createElement(verified ? 'a' : 'div');
        title.className = 'source-title';
        title.textContent = verified ? sourceValue(metadata, 'source_file', sourceValue(metadata, 'file', '未提供文件名')) : '来源待核验';
        if (verified) {
          // Moodle re-checks course visibility and resolves the normalized PDF;
          // the browser never receives a filesystem path or a model URL.
          const params = new URLSearchParams({ source: sourceValue(metadata, 'file', ''), page: String(sourceValue(metadata, 'page', 1)) });
          title.href = `/local/course_agent/resource.php?${params.toString()}`;
          title.target = '_blank';
          title.rel = 'noopener';
        }
        const meta = document.createElement('div');
        meta.className = 'source-meta';
        meta.textContent = metadata.status === 'unverified' ? '本次回答未返回可核验的课程页码' : `${sourceValue(metadata, 'chapter', '未提供章节')} · 第${sourceValue(metadata, 'page', '?')}页`;
        item.append(title, meta);
        sourcesList.append(item);
      });
    }

    form.addEventListener('submit', async (event) => {
      event.preventDefault();
      const text = question.value.trim();
      if (!sessionReady || !featureByMode.get(mode.value)) { status.textContent = '当前角色不能使用该场景。'; return; }
      if (!text) { status.textContent = '请输入问题。'; return; }
      submit.disabled = true;
      answerText.textContent = '';
      sourcesList.textContent = '等待来源...';
      try {
        const requestHeaders = { 'Content-Type': 'application/json' };
        if (moodleSesskey) requestHeaders['X-Moodle-Sesskey'] = moodleSesskey;
        if (mode.value === 'scenario' && currentScenario) requestHeaders['Idempotency-Key'] = `${currentScenario.session_id}:${scenarioTurn + 1}`;
        const response = await fetch('/api/course-agent/chat', {
          method: 'POST',
          credentials: 'same-origin',
          headers: requestHeaders,
          body: JSON.stringify({ question: text, mode: mode.value, session_id: currentScenario?.session_id || null, turn_no: mode.value === 'scenario' ? scenarioTurn + 1 : null })
        });
        if (!response.ok) {
          const payload = await response.json().catch(() => ({}));
          throw new Error(payload.error?.message || `服务返回 HTTP ${response.status}`);
        }
        const reader = response.body.getReader();
        const decoder = new TextDecoder();
        let buffer = '';
        const state = { sources: [], done: false };
        while (true) {
          const { value, done } = await reader.read();
          buffer += decoder.decode(value || new Uint8Array(), { stream: !done });
          const blocks = buffer.split('\n\n');
          buffer = blocks.pop() || '';
          for (const block of blocks) if (block.trim()) consumeEvent(block, state);
          if (done) break;
        }
        if (buffer.trim()) consumeEvent(buffer, state);
        if (!state.done) throw new Error('Agent 流式响应未正常结束。');
      } catch (error) {
        answerText.textContent = answerText.textContent || '本次请求未完成，请稍后重试。';
        if (!sourcesList.textContent || sourcesList.textContent === '等待来源...') sourcesList.textContent = '未获取来源。';
        status.textContent = error instanceof Error ? error.message : '请求失败。';
      } finally {
        submit.disabled = false;
      }
    });
    document.querySelector('#clear').addEventListener('click', clearResults);
    document.querySelector('#loadProfile').addEventListener('click', loadProfile);
    document.querySelector('#loadDiagnosis').addEventListener('click', loadDiagnosis);
    document.querySelector('#loadKnowledgeBase').addEventListener('click', loadKnowledgeBase);
    document.querySelector('#loadAdminStatus').addEventListener('click', loadAdminStatus);
    document.querySelector('#createDraft').addEventListener('click', async () => {
      const prompt = document.querySelector('#draftPrompt').value.trim();
      if (!prompt) { status.textContent = '题干不能为空。'; return; }
      try {
        const type = document.querySelector('#draftType').value;
        const draft = type === 'single_choice' ? { question_type: type, prompt, max_score: 10, options: ['A', 'B'], answer: 'A' } : type === 'true_false' ? { question_type: type, prompt, max_score: 10, answer: true } : { question_type: type, prompt, max_score: 10, rubric: '教师根据课程来源和关键概念复核评分。' };
        await apiJson('/api/teacher/questions', { method: 'POST', headers: { 'Content-Type': 'application/json', 'X-Moodle-Sesskey': moodleSesskey, 'Idempotency-Key': operationKey('question', `${type}|${prompt}`) }, body: JSON.stringify(draft) });
        document.querySelector('#draftPrompt').value = ''; await loadTeacherQuestions(); status.textContent = '题目已保存为草稿。';
      } catch (error) { status.textContent = error.message || '保存题目失败。'; }
    });
    document.querySelector('#createAssignment').addEventListener('click', async () => {
      const title = document.querySelector('#assignmentTitle').value.trim();
      if (!title || !publishedQuestionIds.length) { status.textContent = '请先填写作业名称并发布至少一道题。'; return; }
      try {
        const data = await apiJson('/api/teacher/assignments', { method: 'POST', headers: { 'Content-Type': 'application/json', 'X-Moodle-Sesskey': moodleSesskey, 'Idempotency-Key': operationKey('assignment', `${title}|${publishedQuestionIds.join(',')}`) }, body: JSON.stringify({ title, question_ids: publishedQuestionIds, allow_attempts: 1 }) });
        await apiJson(`/api/teacher/assignments/${encodeURIComponent(data.id)}/publish`, { method: 'POST', headers: { 'X-Moodle-Sesskey': moodleSesskey, 'Idempotency-Key': `assignment-publish-${data.id}` } });
        await loadAssignments(); status.textContent = '作业已发布。';
      } catch (error) { status.textContent = error.message || '发布作业失败。'; }
    });
    async function startScenario(scenarioKey, label) {
      try {
        currentScenario = await apiJson('/api/scenarios/start', { method: 'POST', headers: { 'Content-Type': 'application/json', 'X-Moodle-Sesskey': moodleSesskey, 'Idempotency-Key': operationKey('scenario-start', `${scenarioKey}|${scenarioStartGeneration}`) }, body: JSON.stringify({ scenario_key: scenarioKey }) });
        scenarioTurn = 0;
        document.querySelector('#scenarioStatus').textContent = `${label}：${currentScenario.goal}。${currentScenario.assumptions}。会话 ${currentScenario.session_id} 已开始。`;
        document.querySelector('#endScenario').disabled = false;
        mode.value = 'scenario';
      } catch (error) { document.querySelector('#scenarioStatus').textContent = error.message || '场景启动失败。'; }
    }
    document.querySelector('#startScenario').addEventListener('click', () => startScenario('grid-dispatch', '并网调度场景'));
    document.querySelector('#startFaultScenario').addEventListener('click', () => startScenario('battery-fault', '故障分析场景'));
    document.querySelector('#endScenario').addEventListener('click', async () => {
      if (!currentScenario) return;
      try {
        await apiJson(`/api/scenarios/${encodeURIComponent(currentScenario.session_id)}/end`, { method: 'POST', headers: { 'Content-Type': 'application/json', 'X-Moodle-Sesskey': moodleSesskey, 'Idempotency-Key': `${currentScenario.session_id}:end` }, body: JSON.stringify({ state: 'completed' }) });
        document.querySelector('#scenarioStatus').textContent = '场景已结束，可以重新开始。';
        document.querySelector('#endScenario').disabled = true;
        currentScenario = null;
        scenarioStartGeneration += 1;
      } catch (error) { document.querySelector('#scenarioStatus').textContent = error.message || '场景结束失败。'; }
    });
    openSession();
  </script>
</body>
</html>
